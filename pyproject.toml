[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labverse"
version = "0.1.0"
description = "Publication artifact for the LabVerse grounded laboratory-agent benchmark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LabVerse Contributors" }]
keywords = ["simulation", "laboratory", "ai-agents", "benchmark", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "json-repair>=0.59,<1.0",
    "transitions>=0.9,<1.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<14.0",
    "pip>=26.1.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
llm = ["anthropic>=0.40", "openai>=1.0"]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]
dev = [
    "anthropic>=0.40",
    "openai>=1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
]

[project.scripts]
labverse = "labverse.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/labverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
